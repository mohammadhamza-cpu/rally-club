<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132b38">
  <title>Rally Club — Stick Badminton</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E🏸%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Standalone arcade game. No network, dependencies, accounts, or backend. -->
  <!-- Implemented in separate physics, controls, AI, scoring, audio and render modules. -->
  <main class="app">
    <header class="masthead"><a class="brand" href="./" aria-label="Rally Club home"><span class="brand-icon">↗</span> RALLY<span>CLUB</span></a><span class="edition">STICK BADMINTON <i></i> COURT 01</span></header>
    <section class="game-shell" aria-label="Badminton arcade game">
      <canvas id="court" width="1200" height="675" tabindex="0" aria-label="Side-view badminton court. Use the controls below to play."></canvas>
      <div id="hud" class="hud" hidden></div>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div class="court-toolbar"><button id="sound" aria-pressed="true" title="Toggle sound">♪ SOUND ON</button><button id="pause" title="Pause or resume">Ⅱ PAUSE</button></div>
    </section>
    <section class="control-strip" aria-label="Controls"><div><span class="control-label">MOVE</span><kbd>A</kbd><kbd>D</kbd><span class="or">/</span><kbd>←</kbd><kbd>→</kbd></div><div><span class="control-label">JUMP</span><kbd>W</kbd><span class="or">/</span><kbd>↑</kbd></div><div><span class="control-label">SWING</span><kbd>SPACE</kbd><span class="or">/</span><kbd>ENTER</kbd></div><div><span class="control-label">PAUSE</span><kbd>P</kbd><span class="or">/</span><kbd>ESC</kbd></div></section>
    <section class="bottom-bar"><p><span class="live-dot"></span> ONE COURT. BIG RALLIES.</p><span id="shot-guide">Choose your match. Find your rhythm.</span><button id="help" class="text-button">HOW TO PLAY ↗</button></section>
    <section id="touch-controls" class="touch-controls" aria-label="Touch controls"><div><button data-control="left" aria-label="Move left">◀</button><button data-control="right" aria-label="Move right">▶</button></div><div><button data-control="drop" title="Hold with Hit for a net shot">DROP</button><button data-control="jump">JUMP</button><button data-control="swing" class="touch-swing">HIT</button></div></section>
    <footer>BUILT FOR THE NEXT RALLY <span>LOCAL PLAY · NO DOWNLOADS · NO ADS</span></footer>
  </main>
  <script src="js/physics.js"></script>
  <script src="js/shots.js"></script>
  <script src="js/collisions.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
